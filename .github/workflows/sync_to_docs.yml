name: Fusionar Todo el Repositorio a un solo Google Doc

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Fusionar absolutamente todos los archivos legibles en uno solo
        run: |
          # Creamos el archivo base temporal
          echo "=== CONSOLIDADO COMPLETO DEL REPOSITORIO ===" > "REPOSITORIOS-GITHUB 2026.txt"
          
          # Buscamos todo tipo de archivo en la rama main, excluyendo ocultos y el de salida
          find . -type f ! -path '*/.*' ! -name "REPOSITORIOS-GITHUB 2026.txt" | while read -r file; do
            if file "$file" | grep -qE 'text|empty|JSON'; then
              echo -e "\n\n=========================================" >> "REPOSITORIOS-GITHUB 2026.txt"
              echo -e " RUTA DEL ARCHIVO: $file" >> "REPOSITORIOS-GITHUB 2026.txt"
              echo -e "=========================================\n" >> "REPOSITORIOS-GITHUB 2026.txt"
              cat "$file" >> "REPOSITORIOS-GITHUB 2026.txt"
            fi
          done

      - name: Subir y Forzar Reemplazo en Google Docs
        uses: skofgar/google-drive-upload-action@v1
        with:
          credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
          filename: "REPOSITORIOS-GITHUB 2026.txt"
          folderId: "16h3KIgT3XeiAbt6U4r3OV5Yao0RTw-zC"
          overwrite: true
          # Forzamos la actualización del documento de procesamiento de texto existente
          mimeType: "application/vnd.google-apps.document"
