<!-- ============================================================
* INTERFAZ: F1_CLI_FORM (VERSIÓN 1.0 - V2 ERP - LIBRO 1)
* MODULO: CLIENTES / PROVEEDORES (TERCEROS UNIFICADOS - ALINEADO CON ALEGRA Y DIAN)
* RESPONSABILIDAD: Captura, validación tributaria y mapeo API de Terceros
* CONEXIÓN BACKEND: 05_CLIENTES.gs, 06_PROVEEDORES.gs y 23_SEGURIDAD.gs
* ESTADO: 100% Sincronizado, Autoadaptativo, con cálculo de DV DIAN en vivo y mapeo de IDs externos
============================================================ -->
<div class="form-container" style="font-family: 'Segoe UI', Arial, sans-serif; max-width: 1100px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: #1f2937;">
  
  <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 800; color: #1e3a8a; border-bottom: 2px solid #e5e7eb; padding-bottom: 12px; display: flex; align-items: center; gap: 10px;">
    👥 Ficha Única de Terceros (Clientes y Proveedores)
  </h2>

  <!-- Alerta / Mensaje -->
  <div id="CLI_ALERT" class="message-box" style="display: none; padding: 12px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 20px; line-height: 1.5;"></div>

  <!-- Buscador en Caliente -->
  <div class="search-card" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 25px; display: flex; gap: 10px; align-items: center;">
    <span style="font-size: 18px;">🔍</span>
    <input type="text" id="buscarTercero" style="flex: 1; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;" placeholder="Buscar tercero por NIT, Cédula, Razón Social o ID...">
    <button class="btn btn-secondary" onclick="buscarTercero()" style="background-color: #475569; color: white; border: none; padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s;">Consultar ERP</button>
    <button class="btn btn-primary" onclick="nuevoTercero()" style="background-color: #2563eb; color: white; border: none; padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s;">+ Limpiar / Nuevo</button>
  </div>

  <!-- Tipo de Tercero Checkboxes -->
  <div style="background-color: #f1f5f9; border-radius: 8px; padding: 18px; margin-bottom: 25px;">
    <strong style="display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; color: #475569; margin-bottom: 12px; letter-spacing: 0.5px;">Tipo de tercero</strong>
    <div style="display: flex; gap: 40px; flex-wrap: wrap;">
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="tipo_cliente" checked style="width: 16px; height: 16px; cursor: pointer;"> Clientes <span style="font-size: 11px; color: #64748b; font-weight: 500;">(Ventas, cartera, cotizaciones)</span>
      </label>
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="tipo_proveedor" style="width: 16px; height: 16px; cursor: pointer;"> Proveedores <span style="font-size: 11px; color: #64748b; font-weight: 500;">(Compras, costos, CxP)</span>
      </label>
      <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer;">
        <input type="checkbox" id="tipo_otros" style="width: 16px; height: 16px; cursor: pointer;"> Otros <span style="font-size: 11px; color: #64748b; font-weight: 500;">(Bancos, ONGs, etc.)</span>
      </label>
    </div>
  </div>

  <!-- Form Layout -->
  <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
    
    <!-- Columna Izquierda: Datos Básicos -->
    <div class="form-col" style="display: flex; flex-direction: column; gap: 20px;">
      
      <div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px;">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 15px; font-weight: 800; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">📌 Datos Básicos</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Tipo Persona *</label>
            <select id="TIPO_PERSONA" onchange="alternarTipoPersona(this.value)" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="PERSONA_JURIDICA" selected>Jurídica</option>
              <option value="PERSONA_NATURAL">Natural</option>
            </select>
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Tipo Identificación *</label>
            <select id="TIPO_DOCUMENTO" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="NIT" selected>NIT (Número Identificación Tributaria)</option>
              <option value="CC">CC (Cédula de Ciudadanía)</option>
              <option value="CE">CE (Cédula de Extranjería)</option>
              <option value="PAP">Pasaporte</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 4fr 1fr; gap: 10px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Identificación / NIT *</label>
            <input type="text" id="NUMERO_DOCUMENTO" oninput="calcularDVFrontend(this.value)" placeholder="Número sin puntos ni guiones" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px; text-align: center;">Dv</label>
            <input type="text" id="DIGITO_VERIFICACION" readonly placeholder="Dv" style="width: 100%; padding: 8px 5px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-weight: 700; text-align: center; background-color: #f1f5f9;">
          </div>
        </div>

        <!-- Secciones Dinámicas según Tipo Persona -->
        <div id="sec_empresa" class="dynamic-section active" style="margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Razón Social *</label>
            <input type="text" id="RAZON_SOCIAL" placeholder="Razón social legal completa" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div id="sec_persona" class="dynamic-section" style="margin-bottom: 15px; display: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <div class="field">
              <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Primer Nombre *</label>
              <input type="text" id="PRIMER_NOMBRE" placeholder="Ej: Juan" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
            </div>
            <div class="field">
              <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Segundo Nombre</label>
              <input type="text" id="SEGUNDO_NOMBRE" placeholder="Ej: Alejandro" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="field">
              <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Primer Apellido *</label>
              <input type="text" id="PRIMER_APELLIDO" placeholder="Ej: Megudan" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
            </div>
            <div class="field">
              <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Segundo Apellido</label>
              <input type="text" id="SEGUNDO_APELLIDO" placeholder="Ej: Ruiz" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Nombre Comercial</label>
            <input type="text" id="NOMBRE_COMERCIAL" placeholder="Nombre de fantasía o marca" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Clasificación Comercial *</label>
            <select id="TIPO_CLIENTE" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="MAYORISTA" selected>Mayorista</option>
              <option value="MINORISTA">Minorista / Detal</option>
              <option value="EMPRESARIAL">Empresarial / Corporativo</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Ciudad</label>
            <input type="text" id="CIUDAD" value="Pitalito" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Departamento</label>
            <input type="text" id="DEPARTAMENTO" value="Huila" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">País *</label>
            <input type="text" id="PAIS" value="COLOMBIA" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Dirección Principal</label>
          <input type="text" id="DIRECCION" placeholder="Ej: Cra 4 # 3-50 Pitalito" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Teléfono Fijo</label>
            <input type="text" id="TELEFONO" placeholder="Número fijo" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Celular / WhatsApp</label>
            <input type="text" id="CELULAR" placeholder="Número móvil" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Correo Electrónico (Factura Electrónica) *</label>
          <input type="email" id="CORREO" placeholder="ejemplo@correo.com" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
        </div>

        <div class="field">
          <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
            <input type="checkbox" id="contacto_pagador" checked style="width: 14px; height: 14px;"> Marcar como contacto <strong>Pagador</strong> (Notificaciones de Cartera/Cobro)
          </label>
        </div>

      </div>

    </div>

    <!-- Columna Derecha: Tributaria & Comercial -->
    <div class="form-col" style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Card Tributaria (DIAN) -->
      <div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px;">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 15px; font-weight: 800; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">🧾 Datos Tributarios y DIAN</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Régimen IVA *</label>
            <select id="RESPONSABILIDAD_IVA" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="NO_RESPONSABLE_IVA" selected>No Responsable de IVA</option>
              <option value="RESPONSABLE_IVA">Responsable de IVA</option>
            </select>
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Régimen Tributario *</label>
            <select id="REGIMEN_FISCAL" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="ORDINARIO" selected>Régimen Ordinario</option>
              <option value="SIMPLE">Régimen Simple (RST)</option>
              <option value="ESPECIAL">Régimen Especial</option>
            </select>
          </div>
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Responsabilidad Fiscal (RUT) *</label>
          <div class="rut-checklist" style="display: flex; flex-direction: column; gap: 8px; background-color: #f8fafc; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; font-weight: 600;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" name="responsabilidad_rut" value="O-13" id="resp_o13">
              <span style="background-color: #e2e8f0; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;">O-13</span> Gran Contribuyente
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" name="responsabilidad_rut" value="O-15" id="resp_o15">
              <span style="background-color: #e2e8f0; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;">O-15</span> Autorretenedor
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" name="responsabilidad_rut" value="O-23" id="resp_o23">
              <span style="background-color: #e2e8f0; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;">O-23</span> Agente Retención IVA
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" name="responsabilidad_rut" value="O-47" id="resp_o47">
              <span style="background-color: #e2e8f0; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;">O-47</span> Régimen Simple Tributación
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" name="responsabilidad_rut" value="R-99-PN" id="resp_r99" checked>
              <span style="background-color: #e2e8f0; color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;">R-99-PN</span> No Aplica - Otros
            </label>
          </div>
          <!-- Almacén oculto compilado -->
          <input type="hidden" id="RESPONSABILIDAD_FISCAL" value="R-99-PN">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Mapeo ID Siigo</label>
            <input type="text" id="ID_SIIGO" placeholder="Identificador Siigo" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Mapeo ID Alegra</label>
            <input type="text" id="ID_ALEGRA" placeholder="Identificador Alegra" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

      </div>

      <!-- Card Comercial, Obras & Cuentas -->
      <div style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px;">
        <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 15px; font-weight: 800; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">⚙️ Configuración Operativa</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Condición Pago</label>
            <select id="FORMA_PAGO" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="CONTADO" selected>Contado</option>
              <option value="CREDITO">Crédito</option>
            </select>
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Método habitual Pago</label>
            <select id="METODO_PAGO" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
              <option value="TRANSFERENCIA" selected>Transferencia Bancaria</option>
              <option value="EFECTIVO">Efectivo / Caja</option>
              <option value="CHEQUE">Cheque</option>
              <option value="TARJETA">Tarjeta Débito/Crédito</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Plazo Pago (Días)</label>
            <input type="number" id="PLAZO_PAGO_DIAS" min="0" value="0" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Límite Crédito (COP)</label>
            <input type="number" id="LIMITE_CREDITO" min="0" value="0" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Vendedor Operativo</label>
            <input type="text" id="VENDEDOR_ASIGNADO" placeholder="Código de vendedor" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Centro Costo Vinculado</label>
            <input type="text" id="CENTRO_COSTO" placeholder="Código centro de costo" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Obra / Proyecto Principal</label>
            <input type="text" id="OBRA_PRINCIPAL" placeholder="ID Obra principal" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
          <div class="field">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Auxiliar Contable</label>
            <input type="text" id="CUENTA_CONTABLE_CLIENTE" placeholder="Ej: 130505 o 220505" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
          </div>
        </div>

        <div class="field">
          <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 5px;">Estado Operación *</label>
          <select id="ESTADO_CLIENTE" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;">
            <option value="ACTIVO" selected>Activo</option>
            <option value="INACTIVO">Inactivo</option>
            <option value="BLOQUEADO">Bloqueado</option>
          </select>
        </div>

      </div>

<script>
  // Sincronizar checkboxes de responsabilidades DIAN
  document.querySelectorAll('input[name="responsabilidad_rut"]').forEach(cb => {
    cb.addEventListener("change", compilarResponsabilidadesRUT);
  });

  function compilarResponsabilidadesRUT() {
    const checked = document.querySelectorAll('input[name="responsabilidad_rut"]:checked');
    const valores = [];
    checked.forEach(cb => {
      valores.push(cb.value);
    });
    // Si no hay ninguno, colocar por defecto R-99-PN
    if (valores.length === 0) {
      valores.push("R-99-PN");
      document.getElementById("resp_r99").checked = true;
    } else if (valores.length > 1 && valores.includes("R-99-PN")) {
      // Si seleccionó otro junto con R-99-PN, desmarcar R-99-PN
      const idx = valores.indexOf("R-99-PN");
      valores.splice(idx, 1);
      document.getElementById("resp_r99").checked = false;
    }
    const unificado = valores.join(",");
    document.getElementById("RESPONSABILIDAD_FISCAL").value = unificado;
    return unificado;
  }

  function alternarTipoPersona(tipo) {
    const secEmpresa = document.getElementById("sec_empresa");
    const secPersona = document.getElementById("sec_persona");
    if (tipo === "PERSONA_NATURAL") {
      secEmpresa.style.display = "none";
      secPersona.style.display = "block";
    } else {
      secPersona.style.display = "none";
      secEmpresa.style.display = "block";
    }
  }

  function calcularDVFrontend(nit) {
    if (!nit) {
      document.getElementById("DIGITO_VERIFICACION").value = "";
      return;
    }
    const limpio = nit.replace(/\D/g, "");
    if (!limpio || isNaN(limpio)) {
      document.getElementById("DIGITO_VERIFICACION").value = "";
      return;
    }
    const v = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];
    let suma = 0;
    const len = limpio.length;
    for (let i = 0; i < len; i++) {
      suma += parseInt(limpio.charAt(len - 1 - i), 10) * v[i];
    }
    const residuo = suma % 11;
    const dv = (residuo > 1) ? String(11 - residuo) : String(residuo);
    document.getElementById("DIGITO_VERIFICACION").value = dv;
  }

  function mostrarMensaje(texto, tipo) {
    const alertBox = document.getElementById("CLI_ALERT");
    alertBox.textContent = texto;
    if (tipo === "success") {
      alertBox.style.backgroundColor = "rgba(22, 163, 74, 0.15)";
      alertBox.style.color = "#16a34a";
      alertBox.style.border = "1px solid rgba(22, 163, 74, 0.3)";
    } else if (tipo === "error") {
      alertBox.style.backgroundColor = "rgba(220, 38, 38, 0.15)";
      alertBox.style.color = "#dc2626";
      alertBox.style.border = "1px solid rgba(220, 38, 38, 0.3)";
    } else {
      alertBox.style.backgroundColor = "rgba(37, 99, 235, 0.15)";
      alertBox.style.color = "#2563eb";
      alertBox.style.border = "1px solid rgba(37, 99, 235, 0.3)";
    }
    alertBox.style.display = "block";
  }

    document.getElementById("ID_CLIENTE").value = "";

    document.getElementById("DIGITO_VERIFICACION").value = "";

    document.getElementById("SEGUNDO_NOMBRE").value = "";
    document.getElementById("PRIMER_APELLIDO").value = "";
    document.getElementById("SEGUNDO_APELLIDO").value = "";
    document.getElementById("NOMBRE_COMERCIAL").value = "";
    document.getElementById("DIRECCION").value = "";
    document.getElementById("TELEFONO").value = "";
    document.getElementById("CELULAR").value = "";
    document.getElementById("CORREO").value = "";
    document.getElementById("PLAZO_PAGO_DIAS").value = "0";
    document.getElementById("LIMITE_CREDITO").value = "0";
    document.getElementById("VENDEDOR_ASIGNADO").value = "";

    document.getElementById("OBRA_PRINCIPAL").value = "";

    });
    document.getElementById("RESPONSABILIDAD_FISCAL").value = "R-99-PN";
    
    // Resetear selects
    document.getElementById("TIPO_PERSONA").value = "PERSONA_JURIDICA";
    document.getElementById("TIPO_DOCUMENTO").value = "NIT";
    document.getElementById("TIPO_CLIENTE").value = "MAYORISTA";
    document.getElementById("RESPONSABILIDAD_IVA").value = "NO_RESPONSABLE_IVA";
    document.getElementById("REGIMEN_FISCAL").value = "ORDINARIO";
    document.getElementById("ESTADO_CLIENTE").value = "ACTIVO";
    document.getElementById("FORMA_PAGO").value = "CONTADO";
    document.getElementById("METODO_PAGO").value = "TRANSFERENCIA";
    
    alternarTipoPersona("PERSONA_JURIDICA");
  }

  function nuevoTercero() {
    limpiarFormulario();
    CLI_MODO = "NUEVO";
    mostrarMensaje("Formulario listo para registrar un nuevo Tercero.", "info");
    
    const esProveedor = document.getElementById("tipo_proveedor").checked && !document.getElementById("tipo_cliente").checked;
    
    if (esProveedor) {
      google.script.run
        .withSuccessHandler(function(idGenerado) {
          document.getElementById("ID_CLIENTE").value = idGenerado;
          mostrarMensaje("Código asignado para Proveedor: " + idGenerado, "info");
        })
        .PROV_GENERAR_ID(TOKEN_SESION);
    } else {
      google.script.run
        .withSuccessHandler(function(idGenerado) {
          document.getElementById("ID_CLIENTE").value = idGenerado;
          mostrarMensaje("Código asignado para Cliente: " + idGenerado, "info");
        })
        .CLI_GENERAR_ID(TOKEN_SESION);
    }
  }

  function obtenerDatosFormulario() {
    return {
      ID_CLIENTE: document.getElementById("ID_CLIENTE").value.trim(),
      TIPO_PERSONA: document.getElementById("TIPO_PERSONA").value,
      TIPO_DOCUMENTO: document.getElementById("TIPO_DOCUMENTO").value,
      NUMERO_DOCUMENTO: document.getElementById("NUMERO_DOCUMENTO").value.trim(),
      DIGITO_VERIFICACION: document.getElementById("DIGITO_VERIFICACION").value.trim(),
      RAZON_SOCIAL: document.getElementById("RAZON_SOCIAL").value.trim(),
      PRIMER_NOMBRE: document.getElementById("PRIMER_NOMBRE").value.trim(),
      SEGUNDO_NOMBRE: document.getElementById("SEGUNDO_NOMBRE").value.trim(),
      PRIMER_APELLIDO: document.getElementById("PRIMER_APELLIDO").value.trim(),
      SEGUNDO_APELLIDO: document.getElementById("SEGUNDO_APELLIDO").value.trim(),
      NOMBRE_COMERCIAL: document.getElementById("NOMBRE_COMERCIAL").value.trim(),
      TIPO_CLIENTE: document.getElementById("TIPO_CLIENTE").value,
      CIUDAD: document.getElementById("CIUDAD").value.trim(),
      DEPARTAMENTO: document.getElementById("DEPARTAMENTO").value.trim(),
      PAIS: document.getElementById("PAIS").value.trim(),
      DIRECCION: document.getElementById("DIRECCION").value.trim(),
      TELEFONO: document.getElementById("TELEFONO").value.trim(),
      CELULAR: document.getElementById("CELULAR").value.trim(),
      CORREO: document.getElementById("CORREO").value.trim(),
      RESPONSABILIDAD_IVA: document.getElementById("RESPONSABILIDAD_IVA").value,
      REGIMEN_FISCAL: document.getElementById("REGIMEN_FISCAL").value,
      RESPONSABILIDAD_FISCAL: document.getElementById("RESPONSABILIDAD_FISCAL").value,
      ID_SIIGO: document.getElementById("ID_SIIGO").value.trim(),
      ID_ALEGRA: document.getElementById("ID_ALEGRA").value.trim(),
      FORMA_PAGO: document.getElementById("FORMA_PAGO").value,
      METODO_PAGO: document.getElementById("METODO_PAGO").value,
      PLAZO_PAGO_DIAS: Number(document.getElementById("PLAZO_PAGO_DIAS").value || 0),
      LIMITE_CREDITO: Number(document.getElementById("LIMITE_CREDITO").value || 0),
      VENDEDOR_ASIGNADO: document.getElementById("VENDEDOR_ASIGNADO").value.trim(),
      CENTRO_COSTO: document.getElementById("CENTRO_COSTO").value.trim(),
      OBRA_PRINCIPAL: document.getElementById("OBRA_PRINCIPAL").value.trim(),
      CUENTA_CONTABLE_CLIENTE: document.getElementById("CUENTA_CONTABLE_CLIENTE").value.trim(),
      ESTADO_CLIENTE: document.getElementById("ESTADO_CLIENTE").value,
      OBSERVACIONES: document.getElementById("OBSERVACIONES").value.trim()
    };
  }

  function guardarTercero() {
    compilarResponsabilidadesRUT();
    const datos = obtenerDatosFormulario();
    if (!datos.NUMERO_DOCUMENTO || !datos.CORREO) {
      mostrarMensaje("La Identificación/NIT y el Correo Electrónico son obligatorios.", "error");
      return;
    }
    if (datos.TIPO_PERSONA === "PERSONA_JURIDICA" && !datos.RAZON_SOCIAL) {
      mostrarMensaje("La Razón Social es obligatoria para Personas Jurídicas.", "error");
      return;
    }
    if (datos.TIPO_PERSONA === "PERSONA_NATURAL" && (!datos.PRIMER_NOMBRE || !datos.PRIMER_APELLIDO)) {
      mostrarMensaje("El Primer Nombre y Primer Apellido son obligatorios para Personas Naturales.", "error");
      return;
    }

    const esProveedor = document.getElementById("tipo_proveedor").checked && !document.getElementById("tipo_cliente").checked;
    
    mostrarMensaje("Guardando tercero en la base de datos...", "info");
    
    if (esProveedor) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.EXITO) {
            mostrarMensaje("¡Proveedor guardado exitosamente con ID: " + res.ID_PROVEEDOR + "!", "success");
            document.getElementById("ID_CLIENTE").value = res.ID_PROVEEDOR;
            CLI_MODO = "EDITAR";
          } else {
            mostrarMensaje("Error al guardar proveedor: " + (res ? res.MENSAJE : "Sin respuesta"), "error");
          }
        })
        .withFailureHandler(function(err) {
          mostrarMensaje("Error de red: " + err.message, "error");
        })
        .PROV_GUARDAR_PROVEEDOR(datos, TOKEN_SESION);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.EXITO) {
            mostrarMensaje("¡Cliente guardado exitosamente con ID: " + res.ID_CLIENTE + "!", "success");
            document.getElementById("ID_CLIENTE").value = res.ID_CLIENTE;
            CLI_MODO = "EDITAR";
          } else {
            mostrarMensaje("Error al guardar cliente: " + (res ? res.MENSAJE : "Sin respuesta"), "error");
          }
        })
        .withFailureHandler(function(err) {
          mostrarMensaje("Error de red: " + err.message, "error");
        })
        .CLI_GUARDAR_CLIENTE(datos, TOKEN_SESION);
    }
  }

  function actualizarTercero() {
    compilarResponsabilidadesRUT();
    const datos = obtenerDatosFormulario();
    if (!datos.ID_CLIENTE) {
      mostrarMensaje("Debe cargar o buscar un tercero primero.", "error");
      return;
    }
    mostrarMensaje("Actualizando registro...", "info");
    
    const esProveedor = datos.ID_CLIENTE.startsWith("PROV");
    
    if (esProveedor) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.EXITO) {
            mostrarMensaje("¡Proveedor actualizado exitosamente!", "success");
          } else {
            mostrarMensaje("Error al actualizar: " + (res ? res.MENSAJE : "Sin respuesta"), "error");
          }
        })
        .withFailureHandler(function(err) {
          mostrarMensaje("Error de red: " + err.message, "error");
        })
        .PROV_ACTUALIZAR_PROVEEDOR(datos, TOKEN_SESION);
    } else {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.EXITO) {
            mostrarMensaje("¡Cliente actualizado exitosamente!", "success");
          } else {
            mostrarMensaje("Error al actualizar: " + (res ? res.MENSAJE : "Sin respuesta"), "error");
          }
        })
        .withFailureHandler(function(err) {
          mostrarMensaje("Error de red: " + err.message, "error");
        })
        .CLI_ACTUALIZAR_CLIENTE(datos, TOKEN_SESION);
    }
  }

  function buscarTercero() {
    const criterio = document.getElementById("buscarTercero").value.trim();
    if (!criterio) {
      mostrarMensaje("Por favor digite un NIT, Cédula, Nombre o ID para realizar la búsqueda.", "error");
      return;
    }
    mostrarMensaje("Consultando base de datos...", "info");
    
    // Primero buscar en Clientes
    google.script.run
      .withSuccessHandler(function(cliente) {
        if (cliente) {
          cargarTerceroFormulario(cliente, "CLIENTE");
          mostrarMensaje("Cliente encontrado e inyectado con éxito.", "success");
        } else {
          // Si no se encuentra en clientes, buscar en proveedores
          google.script.run
            .withSuccessHandler(function(prov) {
              if (prov) {
                cargarTerceroFormulario(prov, "PROVEEDOR");
                mostrarMensaje("Proveedor encontrado e inyectado con éxito.", "success");
              } else {
                mostrarMensaje("No se encontró ningún tercero con el criterio ingresado.", "error");
              }
            })
            .withFailureHandler(function(err) {
              mostrarMensaje("Error de red buscando proveedor: " + err.message, "error");
            })
            .PROV_BUSCAR_PROVEEDOR(criterio);
        }
      })
      .withFailureHandler(function(err) {
        mostrarMensaje("Error de red buscando cliente: " + err.message, "error");
      })
      .CLI_BUSCAR_CLIENTE(criterio);
  }

  function cargarTerceroFormulario(tercero, tipoTercero) {

      document.getElementById("tipo_cliente").checked = true;

      document.getElementById("ID_CLIENTE").value = tercero.ID_CLIENTE || "";
      document.getElementById("TIPO_PERSONA").value = tercero.TIPO_PERSONA || "PERSONA_JURIDICA";
      document.getElementById("TIPO_DOCUMENTO").value = tercero.TIPO_DOCUMENTO || "NIT";
      document.getElementById("NUMERO_DOCUMENTO").value = tercero.NUMERO_DOCUMENTO || "";
      document.getElementById("DIGITO_VERIFICACION").value = tercero.DIGITO_VERIFICACION || "";
      document.getElementById("RAZON_SOCIAL").value = tercero.RAZON_SOCIAL || "";
      document.getElementById("PRIMER_NOMBRE").value = tercero.PRIMER_NOMBRE || "";
      document.getElementById("SEGUNDO_NOMBRE").value = tercero.SEGUNDO_NOMBRE || "";
      document.getElementById("PRIMER_APELLIDO").value = tercero.PRIMER_APELLIDO || "";
      document.getElementById("SEGUNDO_APELLIDO").value = tercero.SEGUNDO_APELLIDO || "";
      document.getElementById("NOMBRE_COMERCIAL").value = tercero.NOMBRE_COMERCIAL || "";
      document.getElementById("TIPO_CLIENTE").value = tercero.TIPO_CLIENTE || "MAYORISTA";
      document.getElementById("CIUDAD").value = tercero.CIUDAD || "Pitalito";

      document.getElementById("CELULAR").value = tercero.CELULAR || "";
      document.getElementById("CORREO").value = tercero.CORREO || "";
      document.getElementById("RESPONSABILIDAD_IVA").value = tercero.RESPONSABILIDAD_IVA || "NO_RESPONSABLE_IVA";
      document.getElementById("REGIMEN_FISCAL").value = tercero.REGIMEN_FISCAL || "ORDINARIO";
      document.getElementById("RESPONSABILIDAD_FISCAL").value = tercero.RESPONSABILIDAD_FISCAL || "R-99-PN";
      document.getElementById("ID_SIIGO").value = tercero.ID_SIIGO || "";
      document.getElementById("ID_ALEGRA").value = tercero.ID_ALEGRA || "";

      document.getElementById("METODO_PAGO").value = tercero.METODO_PAGO || "TRANSFERENCIA";
      document.getElementById("PLAZO_PAGO_DIAS").value = tercero.PLAZO_PAGO_DIAS || 0;
      document.getElementById("LIMITE_CREDITO").value = tercero.LIMITE_CREDITO || 0;
      document.getElementById("VENDEDOR_ASIGNADO").value = tercero.VENDEDOR_ASIGNADO || "";
      document.getElementById("CENTRO_COSTO").value = tercero.CENTRO_COSTO || "";
      document.getElementById("OBRA_PRINCIPAL").value = tercero.OBRA_PRINCIPAL || "";
      document.getElementById("CUENTA_CONTABLE_CLIENTE").value = tercero.CUENTA_CONTABLE_CLIENTE || "";
      document.getElementById("ESTADO_CLIENTE").value = tercero.ESTADO_CLIENTE || "ACTIVO";
      document.getElementById("OBSERVACIONES").value = tercero.OBSERVACIONES || "";
    } else {
      document.getElementById("tipo_cliente").checked = false;
      document.getElementById("tipo_proveedor").checked = true;
      document.getElementById("ID_CLIENTE").value = tercero.ID_PROVEEDOR || "";
      document.getElementById("TIPO_PERSONA").value = tercero.TIPO_PERSONA || "PERSONA_JURIDICA";
      document.getElementById("TIPO_DOCUMENTO").value = tercero.TIPO_DOCUMENTO || "NIT";
      document.getElementById("NUMERO_DOCUMENTO").value = tercero.NIT_CC || "";
      document.getElementById("DIGITO_VERIFICACION").value = tercero.DV || "";
      document.getElementById("RAZON_SOCIAL").value = tercero.RAZON_SOCIAL || "";
      document.getElementById("NOMBRE_COMERCIAL").value = tercero.NOMBRE_COMERCIAL || "";
      document.getElementById("CONTACTO_PRINCIPAL").value = tercero.NOMBRE_CONTACTO || "";
      document.getElementById("TELEFONO").value = tercero.TELEFONO || "";
      document.getElementById("CORREO").value = tercero.EMAIL || "";
      document.getElementById("DIRECCION").value = tercero.DIRECCION || "";

      document.getElementById("DEPARTAMENTO").value = tercero.DEPARTAMENTO || "HUILA";
      document.getElementById("FORMA_PAGO").value = tercero.CONDICION_PAGO || "CONTADO";

      document.getElementById("RESPONSABILIDAD_FISCAL").value = tercero.RESPONSABILIDAD_FISCAL || "R-99-PN";
    }

    alternarTipoPersona(document.getElementById("TIPO_PERSONA").value);

    // Seleccionar los checkboxes según Responsabilidad Fiscal
    const respString = document.getElementById("RESPONSABILIDAD_FISCAL").value;
    const arrayResp = respString.split(",");
    document.querySelectorAll('input[name="responsabilidad_rut"]').forEach(cb => {
      cb.checked = arrayResp.includes(cb.value);
    });
  }

  // Inicializar DV
  calcularDVFrontend(document.getElementById("NUMERO_DOCUMENTO").value);
</script>
