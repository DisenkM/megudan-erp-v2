<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro | MEGUDAN ERP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #f8fafc;
    }
    .login-container {
      width: 100%; max-width: 440px; margin: 0 auto;
    }
    .card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-logo-icon {
      width: 52px; height: 52px; margin: 0 auto 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    .brand h2 { margin: 0; font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; }
    .brand p { margin: 6px 0 0; font-size: 12px; color: #94a3b8; font-weight: 500; }

    .tabs-login {
      display: flex; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 24px; gap: 8px;
    }
    .tab {
      background: none; border: none; padding: 10px 4px;
      font-size: 13px; font-weight: 700; color: #94a3b8;
      cursor: pointer; transition: all 0.2s; position: relative;
      flex: 1; text-align: center;
    }
    .tab:hover { color: #f8fafc; }
    .tab.active { color: #38bdf8; }
    .tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 2px; background: #38bdf8; box-shadow: 0 0 8px #38bdf8;
      border-radius: 2px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 11px; font-weight: 800; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.5px; }
    .input {
      background: rgba(15, 23, 42, 0.6); border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px; padding: 12px 14px; font-size: 13px; color: #ffffff;
      outline: none; transition: all 0.2s; width: 100%;
    }
    .input:focus {
      border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      background: rgba(15, 23, 42, 0.85);
    }
    .input::placeholder { color: #64748b; }

    .btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff; width: 100%; border: none; border-radius: 10px; padding: 12px;
      font-size: 14px; font-weight: 800; cursor: pointer;
      transition: all 0.2s; text-align: center; margin-top: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35); text-decoration: none; display: inline-block;
    }
    .btn:hover { background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%); transform: translateY(-1px); }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }

    .msg-box {
      display: none; padding: 12px 16px; border-radius: 10px;
      margin-bottom: 20px; font-size: 12px; font-weight: 600; line-height: 1.5;
    }
    .msg-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .msg-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .msg-info { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

    .form-panel { display: none; }
    .form-panel.active { display: block; }
  </style>
</head>
<body>
<div class="login-container">
  <div class="card">
    <div class="brand">
      <div class="brand-logo-icon">M</div>
      <h2>MEGUDAN ERP</h2>
      <p>Control de Operaciones y Seguridad Dual</p>
    </div>

    <div id="alert-box" class="msg-box"></div>

    <div class="tabs-login">
      <button id="tab-sigin" class="tab active" onclick="mostrarPanel('signin')">Ingresar</button>
      <button id="tab-signup" class="tab" onclick="mostrarPanel('signup')">Registrarse</button>
      <button id="tab-recovery" class="tab" onclick="mostrarPanel('recovery')">Recuperar</button>
    </div>

    <!-- Panel Signin -->
    <div id="panel-signin" class="form-panel active">
      <div class="field">
        <label for="credencial">Usuario o Correo *</label>
        <input type="text" id="credencial" class="input" placeholder="Ej: admin o usuario@megudan.com" onkeypress="if(event.key==='Enter') ejecutarLogin()">
      </div>
      <div class="field">
        <label for="contrasena">Contraseña *</label>
        <input type="password" id="contrasena" class="input" placeholder="Digite su contraseña de acceso" onkeypress="if(event.key==='Enter') ejecutarLogin()">
      </div>
      <button id="btn-login" class="btn" onclick="ejecutarLogin()">Ingresar al ERP</button>
    </div>

    <!-- Panel Signup -->
    <div id="panel-signup" class="form-panel">
      <p style="font-size:12px; color:#94a3b8; line-height:1.5; margin-bottom:16px;">
        Crea tu cuenta de operador en el ERP. Se registrará con estado <strong>PENDIENTE</strong> para aprobación administrativa.
      </p>
      <div class="field">
        <label for="reg_usuario">Usuario (Login) *</label>
        <input type="text" id="reg_usuario" class="input" placeholder="Ej: m_perez">
      </div>
      <div class="field">
        <label for="reg_nombre">Nombre Completo *</label>
        <input type="text" id="reg_nombre" class="input" placeholder="Ej: Mario Pérez">
      </div>
      <div class="field">
        <label for="reg_correo">Correo Electrónico *</label>
        <input type="email" id="reg_correo" class="input" placeholder="Ej: mperez@megudan.com">
      </div>
      <div class="field">
        <label for="reg_contrasena">Contraseña *</label>
        <input type="password" id="reg_contrasena" class="input" placeholder="Mín. 8 caract. (1 Mayús, 1 Núm)">
      </div>
      <button id="btn-register" class="btn" onclick="ejecutarRegistro()">Registrarse</button>
    </div>

    <!-- Panel Recovery -->
    <div id="panel-recovery" class="form-panel">
      <p style="font-size:12px; color:#94a3b8; line-height:1.5; margin-bottom:16px;">
        Ingresa tu correo corporativo para recibir una contraseña temporal de acceso.
      </p>
      <div class="field">
        <label for="correo-rec">Correo Corporativo *</label>
        <input type="email" id="correo-rec" class="input" placeholder="correo@megudan.com">
      </div>
      <button id="btn-recovery" class="btn" onclick="ejecutarRecuperacion()">Enviar Clave Temporal</button>
    </div>
  </div>
</div>

<script>
  var WEB_APP_URL = "<?= WEB_APP_URL ?>";

  document.addEventListener("DOMContentLoaded", function() {
    var urlParams = new URLSearchParams(window.location.search);
    var msg = urlParams.get("mensaje");
    if (msg) {
      mostrarAlerta(msg, "info");
    }
  });

  function mostrarPanel(panel) {
    document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
    document.querySelectorAll(".form-panel").forEach(function(p) { p.classList.remove("active"); });
    
    if (panel === "signin") {
      document.getElementById("tab-sigin").classList.add("active");
      document.getElementById("panel-signin").classList.add("active");
    } else if (panel === "signup") {
      document.getElementById("tab-signup").classList.add("active");
      document.getElementById("panel-signup").classList.add("active");
    } else {
      document.getElementById("tab-recovery").classList.add("active");
      document.getElementById("panel-recovery").classList.add("active");
    }
    ocultarAlerta();
  }

  function mostrarAlerta(texto, tipo) {
    var box = document.getElementById("alert-box");
    box.textContent = texto;
    box.className = "msg-box msg-" + tipo;
    box.style.display = "block";
  }

  function ocultarAlerta() {
    document.getElementById("alert-box").style.display = "none";
  }

  function ejecutarLogin() {
    var user = document.getElementById("credencial").value.trim();
    var pass = document.getElementById("contrasena").value;
    var btn = document.getElementById("btn-login");

    if (!user || !pass) {
      mostrarAlerta("Por favor complete todos los campos obligatorios.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Validando credenciales...";
    mostrarAlerta("Conectando con el ERP...", "info");

    google.script.run
      .withSuccessHandler(function(autenticacion) {
        if (!autenticacion) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarAlerta("Error de autenticación. Recargue la página.", "error");
          return;
        }
        if (!autenticacion.EXITO) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarAlerta(autenticacion.MENSAJE || "Credenciales incorrectas.", "error");
          return;
        }

        mostrarAlerta("Credenciales validadas. Redirigiendo...", "success");
        var sesion = autenticacion.SESION;
        if (!sesion || !sesion.TOKEN_SESION) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarAlerta("La sesión no pudo ser inicializada.", "error");
          return;
        }

        var urlBase = WEB_APP_URL || (window.location.origin + window.location.pathname);
        var url = urlBase + "?ruta=dashboard&token=" + sesion.TOKEN_SESION;

        mostrarBotonRedireccionDirecta(url);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Ingresar al ERP";
        mostrarAlerta("Error de sistema: " + err.message, "error");
      })
      .SEG_AUTENTICAR_USUARIO(user, pass);
  }

  function mostrarBotonRedireccionDirecta(url) {
    var card = document.querySelector(".card");
    card.innerHTML = '<div style="text-align:center; padding: 10px 0;"><h3 style="color:#ffffff; margin-bottom:10px;">¡Sesión Autorizada!</h3><p style="color:#94a3b8; font-size:13px; margin-bottom:20px;">Haz clic en el botón inferior para ingresar al Panel de Control:</p><a id="btn_redirect_top" href="' + url + '" target="_top" class="btn" style="background:linear-gradient(135deg, #10b981 0%, #059669 100%); font-weight:800; padding:14px 20px; font-size:14px; text-decoration:none; display:inline-block;">🚀 ENTRAR AL PANEL DE CONTROL</a></div>';
    
    try {
      document.getElementById("btn_redirect_top").click();
    } catch (e) {}
  }

  function ejecutarRegistro() {
    var usr = document.getElementById("reg_usuario").value.trim();
    var nom = document.getElementById("reg_nombre").value.trim();
    var mail = document.getElementById("reg_correo").value.trim();
    var pass = document.getElementById("reg_contrasena").value;
    var btn = document.getElementById("btn-register");

    if (!usr || !nom || !mail || !pass) {
      mostrarAlerta("Complete todos los campos del registro.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Guardando registro...";

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = "Registrarse";
        if (res && res.EXITO) {
          mostrarAlerta(res.MENSAJE, "success");
          document.getElementById("reg_usuario").value = "";
          document.getElementById("reg_nombre").value = "";
          document.getElementById("reg_correo").value = "";
          document.getElementById("reg_contrasena").value = "";
          setTimeout(function() { mostrarPanel("signin"); }, 4000);
        } else {
          mostrarAlerta(res ? res.MENSAJE : "Error al registrar", "error");
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Registrarse";
        mostrarAlerta("Error: " + err.message, "error");
      })
      .SEG_REGISTRAR_USUARIO_PUBLICO({ USUARIO: usr, NOMBRE: nom, CORREO: mail, CONTRASENA_PLANA: pass });
  }

  function ejecutarRecuperacion() {
    var correo = document.getElementById("correo-rec").value.trim();
    var btn = document.getElementById("btn-recovery");

    if (!correo) {
      mostrarAlerta("Digite su correo corporativo.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Enviando solicitud...";

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = "Enviar Clave Temporal";
        if (res && res.EXITO) {
          mostrarAlerta(res.MENSAJE, "success");
          document.getElementById("correo-rec").value = "";
        } else {
          mostrarAlerta(res ? res.MENSAJE : "Error en solicitud", "error");
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Enviar Clave Temporal";
        mostrarAlerta("Error: " + err.message, "error");
      })
      .SEG_SOLICITAR_RECUPERACION_CONTRASENA(correo);
  }
</script>
</body>
</html>
