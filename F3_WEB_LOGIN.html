<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | MEGUDAN ERP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #f3f4f6;
    }
    .login-container {
      width: 100%; max-width: 440px;
      background: #ffffff; color: #111827;
      padding: 35px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: 0.3s;
    }
    .brand { text-align: center; margin-bottom: 25px; }
    .brand h1 { margin: 0; font-size: 24px; color: #111827; font-weight: bold; }
    .brand p { margin: 5px 0 0; font-size: 13px; color: #6b7280; }
    .field { display: flex; flex-direction: column; margin-bottom: 18px; }
    label { font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #374151; }
    input {
      width: 100%; padding: 11px 12px;
      border: 1px solid #d1d5db; border-radius: 7px;
      font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus {
      border-color: #374151;
      box-shadow: 0 0 0 3px rgba(55, 65, 81, 0.15);
    }
    .btn-submit {
      width: 100%; padding: 12px;
      background: #111827; color: white;
      border: none; border-radius: 7px;
      font-size: 14px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .btn-submit:hover { background: #1f2937; }
    .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }
    .message {
      padding: 10px 12px; border-radius: 6px;
      font-size: 13px; font-weight: bold;
      margin-bottom: 15px; display: none;
    }
    .message.success { background: #dcfce7; color: #166534; }
    .message.error { background: #fee2e2; color: #991b1b; }
    .message.info { background: #dbeafe; color: #1e40af; }
    .footer { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 20px; }
    .switch-link { text-align: center; margin-top: 15px; font-size: 13px; color: #4b5563; }
    .switch-link a { color: #2563eb; font-weight: bold; text-decoration: none; }
    .switch-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <h1 id="form_title">MEGUDAN</h1>
      <p id="form_subtitle">ERP Operativo · Inicio de Sesión</p>
    </div>

    <div id="login_mensaje" class="message"></div>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form id="form_login" onsubmit="procesarLogin(event)">
      <div class="field">
        <label for="credencial">Usuario o Correo Electrónico</label>
        <input type="text" id="credencial" required placeholder="admin o admin@empresa.com">
      </div>

      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit" id="btn_login_submit">Ingresar al ERP</button>
      
      <p class="switch-link">
        ¿No tienes una cuenta? <a href="#" onclick="toggleForm(true); return false;">Regístrate aquí</a>
      </p>
    </form>

    <!-- FORMULARIO DE REGISTRO AUTÓNOMO -->
    <form id="form_registro" onsubmit="procesarRegistro(event)" style="display: none;">
      <div class="field">
        <label for="reg_usuario">Nombre de Usuario *</label>
        <input type="text" id="reg_usuario" required placeholder="Ej: alejandro25" pattern="^[a-zA-Z0-9_]{3,15}$" title="Solo letras, números y guiones bajos (3 a 15 caracteres)">
      </div>

      <div class="field">
        <label for="reg_nombre">Nombre Completo *</label>
        <input type="text" id="reg_nombre" required placeholder="Ej: Alejandro Megudán">
      </div>

      <div class="field">
        <label for="reg_correo">Correo Electrónico *</label>
        <input type="email" id="reg_correo" required placeholder="correo@empresa.com">
      </div>

      <div class="field">
        <label for="reg_contrasena">Contraseña *</label>
        <input type="password" id="reg_contrasena" required placeholder="Mínimo 8 caracteres, mayúscula, número y especial">
      </div>

      <div class="field">
        <label for="reg_contrasena_confirm">Confirmar Contraseña *</label>
        <input type="password" id="reg_contrasena_confirm" required placeholder="Repite la contraseña">
      </div>

      <button type="submit" class="btn-submit" id="btn_reg_submit">Enviar Solicitud de Registro</button>
      
      <p class="switch-link">
        ¿Ya tienes una cuenta? <a href="#" onclick="toggleForm(false); return false;">Inicia sesión</a>
      </p>
    </form>

    <div class="footer">
      MEGUDAN CONSTRUCCIONES SOSTENIBLES SAS &copy; 2026
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const params = new URLSearchParams(window.location.search);
      const msg = params.get("mensaje");
      if (msg) {
        mostrarMensaje(msg, "error");
      }
    });

    /**
     * Alterna entre el formulario de Login y de Registro
     */
    function toggleForm(showRegister) {
      ocultarMensaje();
      const loginForm = document.getElementById("form_login");
      const registerForm = document.getElementById("form_registro");
      const title = document.getElementById("form_title");
      const subtitle = document.getElementById("form_subtitle");

      if (showRegister) {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
        title.textContent = "Únete a MEGUDAN";
        subtitle.textContent = "Solicitud de Registro de Usuario";
      } else {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
        title.textContent = "MEGUDAN";
        subtitle.textContent = "ERP Operativo · Inicio de Sesión";
      }
    }

    /**
     * Procesa el inicio de sesión
     */
    function procesarLogin(e) {
      e.preventDefault();
      
      const credencial = document.getElementById("credencial").value.trim();
      const contrasena = document.getElementById("contrasena").value;
      const btn = document.getElementById("btn_login_submit");

      if (!credencial || !contrasena) {
        mostrarMensaje("Por favor complete todos los campos.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verificando credenciales...";
      mostrarMensaje("Iniciando conexión segura...", "info");

      google.script.run
        .withSuccessHandler(function(autenticacion) {
          if (!autenticacion.EXITO) {
            btn.disabled = false;
            btn.textContent = "Ingresar al ERP";
            mostrarMensaje(autenticacion.MENSAJE, "error");
            return;
          }

          mostrarMensaje("Generando token de sesión activa...", "info");
          google.script.run
            .withSuccessHandler(function(sesion) {
              if (sesion.EXITO) {
                mostrarMensaje("Sesión concedida. Redirigiendo...", "success");
                const urlDestino = window.location.origin + window.location.pathname + "?ruta=dashboard&token=" + sesion.TOKEN_SESION;
                window.top.location.href = urlDestino;
              } else {
                btn.disabled = false;
                btn.textContent = "Ingresar al ERP";
                mostrarMensaje("Error al conceder sesión.", "error");
              }
            })
            .withFailureHandler(function(errSes) {
              btn.disabled = false;
              btn.textContent = "Ingresar al ERP";
              mostrarMensaje("Error del orquestador: " + errSes.message, "error");
            })
            .SEG_CREAR_SESION(autenticacion.USUARIO.ID_USUARIO);
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarMensaje("Error de comunicación: " + err.message, "error");
        })
        .SEG_AUTENTICAR_USUARIO(credencial, contrasena);
    }

    /**
     * Procesa la solicitud de registro autónomo
     */
    function procesarRegistro(e) {
      e.preventDefault();

      const usuario = document.getElementById("reg_usuario").value.trim();
      const nombre = document.getElementById("reg_nombre").value.trim();
      const correo = document.getElementById("reg_correo").value.trim();
      const contrasena = document.getElementById("reg_contrasena").value;
      const confirmacion = document.getElementById("reg_contrasena_confirm").value;
      const btn = document.getElementById("btn_reg_submit");

      if (!usuario || !nombre || !correo || !contrasena || !confirmacion) {
        mostrarMensaje("Por favor complete todos los campos obligatorios.", "error");
        return;
      }

      if (contrasena !== confirmacion) {
        mostrarMensaje("Las contraseñas ingresadas no coinciden.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando solicitud...";
      mostrarMensaje("Registrando solicitud en Sheets...", "info");

      const datosRegistro = {
        USUARIO: usuario,
        NOMBRE: nombre,
        CORREO: correo,
        CONTRASENA_PLANA: contrasena
      };

      google.script.run
        .withSuccessHandler(function(resultado) {
          btn.disabled = false;
          btn.textContent = "Enviar Solicitud de Registro";

          if (resultado.EXITO) {
            // Limpiar formulario de registro
            document.getElementById("form_registro").reset();
            // Regresar al login
            toggleForm(false);
            // Mostrar mensaje de éxito en la pantalla de login
            mostrarMensaje(resultado.MENSAJE, "success");
          } else {
            mostrarMensaje(resultado.MENSAJE, "error");
          }
        })
        .withFailureHandler(function(error) {
          btn.disabled = false;
          btn.textContent = "Enviar Solicitud de Registro";
          mostrarMensaje("Error del servidor: " + error.message, "error");
        })
        .SEG_REGISTRAR_AUTONOMO(datosRegistro);
    }

    function mostrarMensaje(txt, tipo) {
      const el = document.getElementById("login_mensaje");
      el.textContent = txt;
      el.className = "message " + tipo;
      el.style.display = "block";
    }

    function ocultarMensaje() {
      const el = document.getElementById("login_mensaje");
      el.style.display = "none";
      el.textContent = "";
    }
  </script>
</body>
</html>
