<!-- ============================================================
* INTERFAZ: F3_WEB_LOGIN
* MODULO: SEGURIDAD (ACCESO PUBLICO / WEB PORTAL)
* RESPONSABILIDAD: Portal de inicio de sesión y recuperación de contraseña del ERP
* CONEXIÓN BACKEND: 23_SEGURIDAD.gs y 24_LOGS.gs
* ESTADO: 100% Accessible, Dinámico y Adaptativo
============================================================ -->
<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro | MEGUDAN ERP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #f3f4f6;
    }
    .login-container {
      width: 100%; max-width: 420px; padding: 20px;
    }
    .card {
      background: #ffffff; border-radius: 12px; padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #111827;
    }
    .brand {
      text-align: center; margin-bottom: 25px;
    }
    .brand h2 {
      margin: 0; font-size: 24px; font-weight: 800; color: #1f2937; letter-spacing: 1px;
    }
    .brand p {
      margin: 5px 0 0; font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 700;
    }
    .field {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px;
    }
    .field label {
      font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase;
    }
    .input {
      padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 14px; outline: none; background: #ffffff; width: 100%; transition: all 0.2s;
    }
    .input:focus {
      border-color: #374151; box-shadow: 0 0 0 3px rgba(31,41,55,0.1);
    }
    .btn {
      background: #1f2937; color: white; border: none; padding: 12px 20px;
      border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;
      width: 100%; transition: all 0.2s; text-align: center; display: inline-block;
    }
    .btn:hover { background: #111827; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    
    .msg-box {
      display: none; padding: 12px; border-radius: 6px; font-size: 13px;
      font-weight: 600; margin-bottom: 15px; text-align: center;
    }
    .msg-info { display: block; background: #e0f2fe; color: #0369a1; }
    .msg-error { display: block; background: #fee2e2; color: #991b1b; }
    .msg-success { display: block; background: #dcfce7; color: #166534; }

    .tabs-login {
      display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;
    }
    .tab {
      background: none; border: none; color: #6b7280; font-size: 13px; font-weight: bold;
      cursor: pointer; padding-bottom: 5px; border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: #1f2937; border-bottom-color: #1f2937;
    }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="card">
    <div class="brand">
      <h2>MEGUDAN ERP</h2>
      <p>Control de Operaciones</p>
    </div>

    <div id="alert-box" class="msg-box"></div>

    <div class="tabs-login">
      <button id="tab-sigin" class="tab active" onclick="mostrarPanel('signin')">Ingresar</button>
      <button id="tab-recovery" class="tab" onclick="mostrarPanel('recovery')">Recuperar Clave</button>
    </div>

    <!-- Panel de Login -->
    <div id="panel-signin" class="form-panel active">
      <div class="field">
        <label for="credencial">Usuario o Correo *</label>
        <input type="text" id="credencial" class="input" placeholder="Ej: admin o administrador@megudan.com">
      </div>
      <div class="field">
        <label for="contrasena">Contraseña *</label>
        <input type="password" id="contrasena" class="input" placeholder="Digite su contraseña de acceso">
      </div>
      <button id="btn-login" class="btn" onclick="ejecutarLogin()">Ingresar al ERP</button>
    </div>

    <!-- Panel de Recuperación -->
    <div id="panel-recovery" class="form-panel">
      <p style="font-size:12px; color:#4b5563; line-height:1.5; margin-bottom:15px;">
        Ingrese su dirección de correo corporativo para recibir una contraseña temporal de un solo uso en su bandeja.
      </p>
      <div class="field">
        <label for="correo-rec">Correo electrónico *</label>
        <input type="email" id="correo-rec" class="input" placeholder="ejemplo@megudan.com">
      </div>
      <button id="btn-recovery" class="btn" onclick="ejecutarRecuperacion()">Enviar Contraseña Temporal</button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get("mensaje");
    if (msg) {
      mostrarAlerta(msg, "info");
    }
  });

  function mostrarPanel(panel) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".form-panel").forEach(p => p.classList.remove("active"));
    
    if (panel === "signin") {
      document.getElementById("tab-sigin").classList.add("active");
      document.getElementById("panel-signin").classList.add("active");
    } else {
      document.getElementById("tab-recovery").classList.add("active");
      document.getElementById("panel-recovery").classList.add("active");
    }
    ocultarAlerta();
  }

  function mostrarAlerta(texto, tipo) {
    const box = document.getElementById("alert-box");
    box.textContent = texto;
    box.className = "msg-box msg-" + tipo;
  }

  function ocultarAlerta() {
    document.getElementById("alert-box").style.display = "none";
  }

  function ejecutarLogin() {
    const user = document.getElementById("credencial").value.trim();
    const pass = document.getElementById("contrasena").value;
    const btn = document.getElementById("btn-login");

    if (!user || !pass) {
      mostrarAlerta("Por favor complete todos los campos mandatorios.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Validando credenciales...";
    mostrarAlerta("Conectando con el ERP...", "info");

    google.script.run
      .withSuccessHandler(function(autenticacion) {
        if (!autenticacion) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarAlerta("Error de red o autorización pendiente. Recargue la página.", "error");
          return;
        }
        if (!autenticacion.EXITO) {
          btn.disabled = false;
          btn.textContent = "Ingresar al ERP";
          mostrarAlerta(autenticacion.MENSAJE, "error");
          return;
        }

        mostrarAlerta("Credenciales validadas. Iniciando sesión...", "success");
        google.script.run
          .withSuccessHandler(function(sesion) {
            if (!sesion) {
              btn.disabled = false;
              btn.textContent = "Ingresar al ERP";
              mostrarAlerta("No se pudo recibir respuesta del servidor de sesión.", "error");
              return;
            }
            if (sesion.EXITO) {
              const url = window.location.origin + window.location.pathname + "?ruta=dashboard&token=" + sesion.TOKEN_SESION;
              try { window.top.location.replace(url); } catch (e) { window.location.replace(url); }
            } else {
              btn.disabled = false;
              btn.textContent = "Ingresar al ERP";
              mostrarAlerta("No se pudo iniciar la sesión.", "error");
            }
          })
          .SEG_CREAR_SESION(autenticacion.USUARIO.ID_USUARIO);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Ingresar al ERP";
        mostrarAlerta("Error de sistema: " + err.message, "error");
      })
      .SEG_AUTENTICAR_USUARIO(user, pass);
  }

  function ejecutarRecuperacion() {
    const correo = document.getElementById("correo-rec").value.trim();
    const btn = document.getElementById("btn-recovery");

    if (!correo) {
      mostrarAlerta("Debe proporcionar un correo.", "error");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Procesando...";
    mostrarAlerta("Verificando correo electrónico...", "info");

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = "Enviar Contraseña Temporal";
        if (!res) {
          mostrarAlerta("Error de comunicación de red con el servidor.", "error");
          return;
        }
        if (res.EXITO) {
          mostrarAlerta(res.MENSAJE, "success");
          document.getElementById("correo-rec").value = "";
        } else {
          mostrarAlerta(res.MENSAJE, "error");
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Enviar Contraseña Temporal";
        mostrarAlerta("Error de servidor: " + err.message, "error");
      })
      .SEG_SOLICITAR_RECUPERACION_CONTRASENA(correo);
  }
</script>
</body>
</html>
